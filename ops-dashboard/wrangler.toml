# ops-dashboard — 운영자용 통합 품질 콘솔 (ASK-Seoul#58)
# 마켓플레이스와 **다른 Worker · 다른 호스트**다. 청중이 다르기 때문이다 —
# 저쪽은 외부 고객(키 발급), 여기는 운영자(품질). 배포 단위가 갈려야 사고 반경도 갈린다.
#
# ── 🔴 D1 은 **운영 하나뿐이다** (2026-08-05, decision/0015) ──────────────────
#
# dev D1(`ask-seoul-dev-d1`)을 폐기했다. 이제 **로컬 구동도 운영 D1 을 직접 읽고 쓴다.**
# 예전 규약(로컬 = Miniflare 사본 · 원격 = 보기 전용)은 전부 걷혔다.
#
# 그래서 이 파일에서 사라진 것:
#   - `[env.dev]`               — dev 배포 대상(dev-ops.ask-seoul.kr). 폐기
#   - dev D1 바인딩              — 기본 바인딩이 곧 운영 D1 이다
#   - 로컬/원격을 가르던 `--persist-to` 전제 — 로컬 사본이 없다
#
# ⚠️ **환경 플래그가 안전장치가 아니다.** 예전에는 "플래그가 없으면 언제나 로컬"이라
# 실수의 방향이 안전한 쪽으로 기울었는데, 이제 **기본값이 운영이다.** `npm run dev` 로
# 띄운 화면의 조치 버튼 한 번이 실제 고객 키에 그대로 간다. 그게 이 결정의 대가다
# (decision/0015 §대가 — 팀이 알고 택했다).
#
# 주소 체계(2026-08-04 확정): ask-seoul.kr(서비스 운영) · dev.(서비스 개발) ·
# ops.(콘솔 운영) · dev-ops.(콘솔 개발 — **폐기**).
name = "ask-seoul-ops-dashboard"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = false

# 포트는 여기 고정한다 — 명령줄(--port)이 아니라. 기본값에 맡기면 포트 점유 시 wrangler 가
# 조용히 다음 번호로 넘어가 "떴는데 아무도 못 찾는" 상태가 된다(:8789 로 밀린 실사례).
# 게이트웨이(:8787)와 겹치지 않아야 한다.
[dev]
port = 8788

[assets]
directory = "public"
run_worker_first = ["/api/*"]

# 화면이 "지금 어느 환경의 무슨 DB 를 보고 있나"를 말할 수 있게 하는 값.
#
# **라벨이 거짓말을 하면 안 된다.** 로컬에서 띄워도 보고 있는 것은 운영 D1 이므로
# "로컬 개발"이라고 쓰지 않는다 — 그렇게 쓰면 운영 숫자를 연습용으로 읽고, 더 나쁘게는
# 운영 키를 연습 삼아 누른다.
[vars]
ENV_LABEL = "운영 D1 (로컬 구동)"
ENV_D1 = "ask-seoul-prod-d1"
# 실행 기록을 어느 환경 것만 세느냐. dev D1 이 없어지면서 '개발 화면'과 '운영 화면'의
# 구분도 없어졌다 — 둘 다 같은 DB 를 보므로 **같은 값으로 센다.** 실측(2026-08-04) 운영
# D1 에 `environment='dev'` 17행이 섞여 있고, 거르지 않으면 개발 실행이 운영 지표에 든다
# (#78 Z-7). 무엇이 빠졌는지는 화면이 `runs_env_excluded` 로 직접 밝힌다.
ENV_SCOPE = "prod"

# 🔴 운영 D1. **로컬 구동도 이 값을 쓴다** — `npm run dev` 가 `--remote` 라서 여기 적힌
# database_id 로 실제 운영 DB 에 붙는다. 예전처럼 "로컬은 이 값을 안 쓴다"가 아니다.
#
# 게이트웨이 [env.production](../marketplace/wrangler.toml) 과 **같은 값이어야 한다** —
# 갈리면 콘솔의 응답 상태·이용 패턴 분석·API 사용량·이용자 키 탭이 통째로 빈다(decision/0003).
[[d1_databases]]
binding = "DB"
database_name = "ask-seoul-prod-d1"
database_id = "59a8409e-3be6-467b-8214-7938c59c8729"
# 🔴 **이 두 줄이 없으면 로컬 구동이 운영 D1 을 안 본다.** 그리고 안 본다는 걸 화면이
# 말해 주지 않는다 — 이게 이 설정에서 제일 조용한 사고 경로다.
#
# 실측 기록(2026-08-05), 셋 다 화면은 "운영 D1"이라고 답했다:
#   ① 맨 `wrangler dev --remote`            → 질의 전부 빈 결과. `_catalog` 68행이 0행,
#                                             `_ops_run_event` 27,034행이 0행
#   ② `--remote` + preview_database_id      → 그대로 빈 결과
#   ③ `remote = true` + 그냥 `wrangler dev` → **정상.** runs.daily 98 · expectations 49
#
# `--remote` **플래그는 폐기 경로다**(wrangler 가 기동 로그에서 직접 안내한다). 지금 방식은
# 바인딩에 `remote` 를 켜고 **플래그 없이** `wrangler dev` 를 쓰는 것이다.
# ⚠️ `experimental_remote` 는 이 버전(4.115)에서 **없는 필드**라 경고만 찍고 **local 로
# 조용히 떨어진다** — 오타 하나가 "운영을 본다고 믿으며 빈 로컬을 보는" 상태를 만든다.
remote = true
# 프리뷰 경로로 새지 않도록 database_id 와 **같은 값**으로 못 박는다.
preview_database_id = "59a8409e-3be6-467b-8214-7938c59c8729"
# 경로는 이 파일 기준이 아니라 프로젝트 루트 기준이다(설정이 루트에 있으므로 같다).
migrations_dir = "migrations"
# ⚠️ 장부를 게이트웨이와 **분리한다.** 같은 D1 을 공유하므로(decision/0003) 기본 이름
# `d1_migrations` 를 쓰면 두 프로젝트의 기록이 한 표에 섞인다. 파일명이 겹치는 순간
# (양쪽 다 `0002_*.sql` 을 만들 수 있다) 한쪽이 "이미 적용됨"으로 조용히 건너뛴다.
# 소유가 갈리면 장부도 갈려야 한다 — 콘솔 표는 콘솔 장부가 센다.
migrations_table = "d1_migrations_ops_dashboard"

# ── 운영 배포 — https://ops.ask-seoul.kr ─────────────────────────────────────
# 콘솔의 운영 호스트는 `ops.` 로 게이트웨이(`ask-seoul.kr` 기준 도메인)와 서브도메인으로
# 갈린다 — zone 은 하나여도 Worker·배포·롤백은 따로다(decision/0001).
#
# 바인딩·assets·vars 는 env 에 상속되지 않으므로 여기서 다시 선언한다. 값은 기본 환경과
# **같다** — D1 이 하나뿐이라 갈릴 것이 없다. 그래도 지운 게 아니라 적어 두는 이유는,
# 빠뜨리면 wrangler 가 바인딩 없는 워커를 조용히 배포하기 때문이다.
#
# 🔴 **읽기 경로는 여전히 무인증이다**(decision/0004). 이 호스트가 공개 URL 로 뜨면
# 내부 운영 정보(키 목록·이메일 마스킹본·사용량)가 로그인 없이 노출된다. Cloudflare
# Access 를 **이 호스트로 한정해서** 거는 것이 원래 선행 조건이었고(#20 결정 B-1,
# agreement §8-2 B), API 토큰 권한 미확보로 아직 보류다. zone 전체나 *.ask-seoul.kr 로
# 걸면 공개 API 까지 로그인 뒤로 잠기므로 범위를 반드시 한정한다.
[env.production]
name = "ask-seoul-ops-dashboard"
workers_dev = false
routes = [
  { pattern = "ops.ask-seoul.kr", custom_domain = true }
]

[env.production.assets]
directory = "public"
run_worker_first = ["/api/*"]

[env.production.vars]
ENV_LABEL = "운영"
ENV_D1 = "ask-seoul-prod-d1"
ENV_SCOPE = "prod"

[[env.production.d1_databases]]
binding = "DB"
database_name = "ask-seoul-prod-d1"
database_id = "59a8409e-3be6-467b-8214-7938c59c8729"
migrations_dir = "migrations"
migrations_table = "d1_migrations_ops_dashboard"
