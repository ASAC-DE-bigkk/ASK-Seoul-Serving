# ops-dashboard — 운영자용 통합 품질 콘솔 (ASK-Seoul#58)
# 마켓플레이스와 **다른 Worker · 다른 호스트**다. 청중이 다르기 때문이다 —
# 저쪽은 외부 고객(키 발급), 여기는 운영자(품질). 배포 단위가 갈려야 사고 반경도 갈린다.
#
# 환경 규약은 게이트웨이와 같다 — 기본(위) = 로컬, 배포 = [env.production] 을
# `--env production` 으로 **명시해야만** 선택된다. 플래그가 없으면 언제나 로컬이라
# 실수의 방향이 안전한 쪽으로 기운다. 배치 근거: ../docs/environments.md · decision/0011.
#
# ⚠️ 로컬 전용: wrangler dev 로만 구동. deploy 는 decision/0002(로컬 전용) 개정 +
# 멘토 게이트(#476 ①) + Cloudflare Access 승격(#20 결정 B-1)이 전부 선행이다.
# 아래 [env.production] 은 "승인이 나면 무엇을 쓰면 되는지"의 명세이지, 승인이 아니다.
#
# D1 은 게이트웨이와 **같은 로컬 상태를 공유**한다 — `npm run dev` 의 --persist-to 참고.
# (서빙 품질 원본인 _request_log 가 게이트웨이 쪽 D1 에 쌓이기 때문 — decision/0003)
name = "ask-seoul-ops-dashboard"
main = "src/index.js"
compatibility_date = "2026-07-01"

# 포트는 여기 고정한다 — 명령줄(--port)이 아니라. 기본값에 맡기면 포트 점유 시 wrangler 가
# 조용히 다음 번호로 넘어가 "떴는데 아무도 못 찾는" 상태가 된다(:8789 로 밀린 실사례).
# 게이트웨이(:8787)와 겹치지 않아야 한다.
[dev]
port = 8788

[assets]
directory = "public"
run_worker_first = ["/api/*"]

# 화면이 "지금 어느 환경의 무슨 DB 를 보고 있나"를 말할 수 있게 하는 값. 없으면 운영자가
# 숫자만 보고 어느 쪽 데이터인지 추측하게 된다 — 로컬 샘플을 운영 실적으로 오해하는 게
# 이 콘솔에서 제일 나쁜 사고다. [env.production.vars] 에도 **같이** 넣는다(env 는 상속되지 않는다).
[vars]
ENV_LABEL = "로컬 개발"
ENV_D1 = "ask-seoul-dev-d1"

# dev D1. 로컬(--local)은 이 값을 쓰지 않지만, database_id 가 로컬 상태의 키라서
# 게이트웨이와 **같아야** 같은 로컬 DB 를 본다(decision/0003). prod 로 바꾸지 않는다.
[[d1_databases]]
binding = "DB"
database_name = "ask-seoul-dev-d1"
database_id = "9db0e851-558e-489f-9e76-f131d25aa267"
# 경로는 이 파일 기준이 아니라 프로젝트 루트 기준이다(설정이 루트에 있으므로 같다).
migrations_dir = "migrations"
# ⚠️ 장부를 게이트웨이와 **분리한다.** 같은 D1 을 공유하므로(decision/0003) 기본 이름
# `d1_migrations` 를 쓰면 두 프로젝트의 기록이 한 표에 섞인다. 파일명이 겹치는 순간
# (양쪽 다 `0002_*.sql` 을 만들 수 있다) 한쪽이 "이미 적용됨"으로 조용히 건너뛴다.
# 소유가 갈리면 장부도 갈려야 한다 — 콘솔 표는 콘솔 장부가 센다.
migrations_table = "d1_migrations_ops_dashboard"

# ── 배포 전용 환경 (2026-08-03) ──────────────────────────────────────────────
# 게이트웨이 [env.production](../marketplace/wrangler.toml)과 같은 규약. 콘솔의 운영
# 호스트는 `ops.ask-seoul.kr` 로 게이트웨이(`ask-seoul.kr` 기준 도메인)와 서브도메인으로
# 갈린다 — zone 은 하나여도 Worker·배포·롤백은 따로다(decision/0001).
#
# routes 는 **주석 상태로 둔다.** zone 등록·도메인 보유가 아직 확인되지 않았고(#27 리뷰 ③),
# 활성화 전에 Cloudflare Access 를 이 호스트로 **한정해서** 걸어야 한다 — zone 전체나
# *.ask-seoul.kr 로 걸면 공개 API 까지 로그인 뒤로 잠긴다(#20 결정 B-1).
[env.production]
name = "ask-seoul-ops-dashboard"
# routes = [{ pattern = "ops.ask-seoul.kr", custom_domain = true }]

[env.production.assets]
directory = "public"
run_worker_first = ["/api/*"]

[env.production.vars]
ENV_LABEL = "운영"
ENV_D1 = "ask-seoul-prod-d1"

# 운영 D1(8/3 신설, 게이트웨이 [env.production] 과 같은 값이어야 한다 — 갈리면 콘솔의
# 서빙 품질·키 관리 탭이 통째로 빈다). _ops_slo·_ops_domain 은 여기 소유라 콘솔 공개 전에
# migrations/0001 을 --remote 로 적용해야 한다.
[[env.production.d1_databases]]
binding = "DB"
database_name = "ask-seoul-prod-d1"
database_id = "59a8409e-3be6-467b-8214-7938c59c8729"
