# ops-dashboard — 로컬 개발 (ASK-Seoul#58)
#
# 환경별 설정은 **같은 파일 이름을 다른 디렉토리**에 둔다 — config/local · config/prod.
# 명령이 -c 로 어느 쪽을 읽을지 고르고, 배포도 같은 파일을 참조한다.
# 규약과 대비표: ../../../docs/setup.md
#
# 마켓플레이스와 **다른 Worker · 다른 호스트**다(decision/0001). 청중이 다르기 때문이다 —
# 저쪽은 외부 고객(키 발급), 여기는 운영자(품질). 배포 단위가 갈려야 사고 반경도 갈린다.
#
# ⚠️ 경로는 **이 파일 기준**으로 풀린다. main·assets 가 ../../ 로 시작하는 이유다.
# ⚠️ --persist-to 는 반드시 명시한다. 빼면 로컬 상태가 config/local/.wrangler/state 로
#    잡혀서 게이트웨이와 공유하던 D1 을 잃는다 — 서빙 품질·키 관리 탭이 통째로 빈다.
#    npm scripts 에 이미 넣어 뒀다(../marketplace/.wrangler/state).
#
# ⚠️ 로컬 전용: wrangler dev 로만 구동. deploy 는 멘토 게이트(#476 ①) — decision/0002.
name = "ask-seoul-ops-dashboard"
main = "../../src/index.js"
compatibility_date = "2026-07-01"

# 포트는 **여기에 박는다** — 명령줄(--port)이 아니라. 로컬에만 있는 값이고
# (운영은 routes 가 대신한다), 게이트웨이(:8787)와 겹치면 안 된다.
[dev]
port = 8788

[assets]
directory = "../../public"
run_worker_first = ["/api/*"]

# dev D1. 로컬(--local)은 이 값을 쓰지 않고 --persist-to 가 가리키는 게이트웨이 상태를 읽는다.
# 게이트웨이(../marketplace)와 **같은 D1** 이어야 한다 — 서빙 품질 원본인 _request_log 가
# 저쪽에 쌓이기 때문이다(decision/0003).
[[d1_databases]]
binding = "DB"
database_name = "ask-seoul-dev-d1"
database_id = "9db0e851-558e-489f-9e76-f131d25aa267"
