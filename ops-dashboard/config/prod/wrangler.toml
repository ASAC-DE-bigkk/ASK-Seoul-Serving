# ops-dashboard — 운영 배포 (ASK-Seoul#58)
#
# ⚠️ **이 파일이 있다고 배포가 허용된 게 아니다.** 콘솔의 공개 배포는 decision/0002(로컬 전용)
#    개정 + 멘토 게이트(#476 ①)가 먼저다. 그리고 #20 결정 B-1 에 따라 **Cloudflare Access
#    뒤로 전체(읽기 포함)** 를 넣은 뒤에만 올린다 — 지금 이대로 올리면 무인증으로 전체 키
#    목록이 열린다. package.json 에 deploy 스크립트를 두지 않는 것도 같은 이유다.
#    이 파일은 "그때 무엇을 쓰면 되는지"의 실행 가능한 명세이지, 승인이 아니다.
#
# config/local 과 **같은 파일 이름, 다른 디렉토리**다. 다른 것은 아래 셋뿐이다.
#   ① routes — 운영 호스트  ② D1 — 운영 D1  ③ 이 주석
# 나머지(main·assets·run_worker_first)는 local 과 같아야 한다.
# 규약과 대비표: ../../../docs/setup.md
#
# ⚠️ 경로는 **이 파일 기준**으로 풀린다.
name = "ask-seoul-ops-dashboard"
main = "../../src/index.js"
compatibility_date = "2026-07-01"

# 콘솔은 ops. 서브도메인, API 는 기준 도메인 자체(ask-seoul.kr —
# ../../../marketplace/config/prod/wrangler.toml). zone 은 같지만 Worker·배포·롤백은 따로다.
#
# ⚠️ Cloudflare Access 를 걸 때 **적용 범위를 이 호스트로 한정**할 것.
#    zone 전체나 *.ask-seoul.kr 로 걸면 공개 API(ask-seoul.kr)까지 로그인 뒤로 잠긴다.
routes = [
  { pattern = "ops.ask-seoul.kr", custom_domain = true }
]

[assets]
directory = "../../public"
run_worker_first = ["/api/*"]

# 운영 D1. 게이트웨이 운영 설정과 **같은 값이어야 한다** — 여기가 갈리면 콘솔의 서빙 품질·
# 키 관리 탭이 통째로 빈다(원본이 게이트웨이 쪽 테이블이라 meta.missing 으로 강등된다).
# _ops_slo·_ops_domain 은 여기 소유라 이 D1 에 만들어야 한다(migrations/0001).
#
# ⚠️ database_name 은 **미확인 값**이다 — 게이트웨이 운영 설정과 같이 교체할 것.
[[d1_databases]]
binding = "DB"
database_name = "ask-seoul-prod-d1"
database_id = "59a8409e-3be6-467b-8214-7938c59c8729"
