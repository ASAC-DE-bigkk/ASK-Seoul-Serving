# CD — dev 브랜치에 푸시(머지)되면 dev 환경 두 워커를 자동 배포한다.
# 대상: 게이트웨이(dev.ask-seoul.kr) · 콘솔(dev-ops.ask-seoul.kr). production 은 다루지
# 않는다 — agreement §8-3(prod D1 조율)·Access 승격이 선행이라 자동화 대상이 아니다.
#
# 경로 필터를 두지 않고 매 푸시마다 둘 다 배포한다 — 배포는 멱등이고, 공유 문서·계약
# 변경이 어느 워커에 닿는지 필터로 가르는 비용이 이 규모에선 더 크다.
#
# ⚠️ deploy:dev 스크립트가 아니라 wrangler deploy 를 직접 부른다 — deploy:dev 의
# preflight 는 **마이그레이션 게이트**다(원격 D1 스키마 검사). CD 는 코드만 배포하고
# 마이그레이션은 런북 §1 절차(사람 직접 실행)로 남는다. 게다가 preflight 는 dev D1
# 오염(#52 조율 대기)으로 현재 exit 1 이라, 체인에 넣으면 코드 배포까지 막힌다.
# 테스트는 CI 와 별개로 여기서도 돌린다 — 직푸시가 테스트를 우회하지 못하게.
#
# 필요한 GitHub Secrets:
#   CLOUDFLARE_API_TOKEN  — Workers Scripts:Edit 권한 (배포용)
#   CLOUDFLARE_ACCOUNT_ID — 0d39ddce… (팀 계정)
name: Deploy dev

on:
  push:
    branches: [dev]

# 배포가 겹치면 순서가 꼬인다 — 동시 실행을 막고 뒤 커밋이 기다렸다 나간다.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: marketplace/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Deploy gateway (dev.ask-seoul.kr)
        run: npx wrangler deploy --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ops-dashboard/package-lock.json
      - run: npm ci
      - name: Deploy console (dev-ops.ask-seoul.kr)
        run: npx wrangler deploy --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
