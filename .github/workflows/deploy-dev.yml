# CD — dev 브랜치에 푸시(머지)되면 dev 환경 두 워커를 자동 배포한다.
# 대상: 게이트웨이(dev.ask-seoul.kr) · 콘솔(dev-ops.ask-seoul.kr). production 은 다루지
# 않는다 — agreement §8-3(prod D1 조율)·Access 승격이 선행이라 자동화 대상이 아니다.
#
# 경로 필터를 두지 않고 매 푸시마다 둘 다 배포한다 — 배포는 멱등이고, 공유 문서·계약
# 변경이 어느 워커에 닿는지 필터로 가르는 비용이 이 규모에선 더 크다.
#
# 원격 D1 마이그레이션은 런북 §1 절차대로 사람이 직접 실행한다. 자동배포는 그 작업을
# 대신하지 않고 `--require-applied` 읽기 검사로 **이미 적용됐는지**만 확인한다. 필수 Gateway
# 표가 하나라도 없으면 route 배포 전에 중단한다. 테스트는 CI 와 별개로 여기서도 돌린다 —
# 직푸시가 테스트를 우회하지 못하게.
#
# 필요한 GitHub Secrets:
#   CLOUDFLARE_API_TOKEN  — Workers Scripts:Edit 권한 (배포용)
#   CLOUDFLARE_ACCOUNT_ID — 0d39ddce… (팀 계정)
name: Deploy dev

on:
  push:
    branches: [dev]

# 기본 GITHUB_TOKEN 을 읽기로 좁힌다 — 배포 자격은 Cloudflare secrets 가 담당한다.
permissions:
  contents: read

# 배포가 겹치면 순서가 꼬인다 — 동시 실행을 막고 뒤 커밋이 기다렸다 나간다.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  schema-ready:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketplace/package-lock.json
      - run: npm ci
      - name: Verify dev D1 migrations are applied (read-only)
        run: npm run preflight -- ask-seoul-dev-d1 --env dev --require-applied
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  gateway:
    needs: schema-ready
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketplace/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Deploy gateway (dev.ask-seoul.kr)
        run: npx wrangler deploy --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  console:
    needs: schema-ready
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops-dashboard/package-lock.json
      - run: npm ci
      - name: Deploy console (dev-ops.ask-seoul.kr)
        run: npx wrangler deploy --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
