# marketplace — V1 마켓플레이스 게이트웨이 (ASK-Seoul#58)
# 🔴 로컬 구동은 `npm run dev`(플래그 없는 `wrangler dev`) — **운영 D1 에 실제로 붙는다.**
# dev D1 폐기(#85)로 로컬이 볼 실물이 운영뿐이고, 서빙 메타(권리·컬럼 설명·활용 예시)가
# 운영에만 있어 로컬 픽스처로는 권리 게이트·카탈로그 응답을 검증할 수 없다.
# 대가와 안전장치는 아래 [[d1_databases]] 주석에 있다 — **읽고 나서 쓴다.**
#
# 배포는 환경을 반드시 지정한다 — `npm run deploy:prod`(= `--env production`).
# env 없이 `wrangler deploy` 를 실행하지 않는다: base 는 로컬 전용이고(아래 [vars] 주석),
# 라우트 없는 워커가 하나 더 생긴다. 절차 정본은 docs/deploy-runbook.md,
# 남은 배포 결정 상태는 ../docs/agreement.md §8.
name = "ask-seoul-gateway"
main = "src/index.js"
compatibility_date = "2026-07-01"
# workers.dev 주소는 어느 환경에서도 만들지 않는다 — 진입점이 둘이면 소비자가 붙은 뒤
# 하나를 못 끈다(#476 ② URL 변경 = 파손). 진입점은 환경별 커스텀 도메인 하나씩이다.
workers_dev = false

[assets]
directory = "public"
# Worker 가 정적 자산을 **직접 꺼내 쓰기 위한** 바인딩. `run_worker_first` 로 가져온 경로는
# Assets 가 대신 응답해 주지 않으므로, 없으면 그 경로가 라우터 끝의 problem+json 으로
# 떨어져 **파일이 통째로 깨진다**. 지금 소비자는 `serveTextAsset`(llms.txt·robots.txt 의
# charset 교정) 하나이고, `page_path` 관측(#177)도 이 바인딩이 전제다.
binding = "ASSETS"
# API 라우트는 Worker 로, 그 외 정적 파일은 Assets 가 서빙.
# 새 API 네임스페이스를 만들면 **여기 먼저 등록**해야 한다 — 빠지면 요청이 워커에 닿지도
# 못하고 정적 404 페이지로 떨어진다(경로가 없는 것처럼 보여 원인 찾기가 오래 걸린다).
# /skill/v1/* 은 그 담당이 착수할 때 추가한다(ASAC-DAG#642 경로 분리).
# 정적 문서 넷이 여기 있는 이유는 **둘로 갈린다** — 섞어 읽으면 안 된다:
#   charset 교정(#237)    `/llms.txt` · `/robots.txt`
#   page_path 관측(#285)  `/llms.txt` · `/openapi.json` · `/skill-openapi.json`
# 그래서 **워커 통과 4경로 ≠ 관측 3경로**다(`robots.txt` 는 통과만 하고 세지 않는다).
# 워커를 거치므로 이 넷은 엣지 캐시를 잃는다 — 문서 넷이라 감수한다.
run_worker_first = ["/api/v1/*", "/skill/v1/*", "/mcp", "/llms.txt", "/robots.txt", "/openapi.json", "/skill-openapi.json"]
# 없는 경로는 사람용 404 화면으로 — 이 설정이 없으면 정적 자산에 없는 모든 경로가
# Worker 의 마지막 분기까지 흘러가 application/problem+json 으로 떨어진다.
# 오타 URL 로 들어온 사람이 JSON 덩어리를 보게 되던 원인이었다(/api/* 는 그대로 JSON 이 맞다).
not_found_handling = "404-page"

# 🔴 운영 D1. **로컬 구동도 이 값을 쓴다**(#85 — dev D1 폐기, 콘솔 decision/0015 와 같은 방향).
# 예전엔 "로컬 모드는 id 를 무시하고 이름만 쓴다"였는데, dev D1 이 폐기되면서 로컬이 볼
# 실물이 운영뿐이다. 서빙 메타(권리·컬럼 설명·활용 예시)가 운영에만 있어서, 로컬 픽스처로는
# 권리 게이트(#88)·카탈로그 응답을 **검증할 수 없다** — 실제로 #88 검증 때 표를 손으로
# 만들어야 했다.
#
# ⚠️ 대가를 알고 쓴다: 로컬 구동이 운영 `_keys`·`_usage`·`_burst` 를 **실제로 건드린다.**
#    - 테스트 키는 운영 `_keys` 에 남는다 → 쓰고 나면 `DELETE /api/v1/keys?purge=true` 로 지운다
#    - 요청 로그는 `ASK_ENV="local"` 로 찍혀 콘솔이 환경 스코프로 걸러낸다(#64) — 섞이지 않는다
#    - 쿼터·버스트는 그 키의 것만 소모한다
[[d1_databases]]
binding = "DB"
database_name = "ask-seoul-prod-d1"
database_id = "59a8409e-3be6-467b-8214-7938c59c8729"
# 🔴 `--remote` **플래그를 쓰지 않는다.** 콘솔이 그 함정을 먼저 밟았다(#85 §함정①):
#   맨 `wrangler dev --remote` → 바인딩 이름·배지는 운영이라고 나오는데 **질의만 빈 결과**.
#   강등 로직이 그걸 "표가 없습니다"로 표시해서 **화면만 보면 운영에 데이터가 없는 것처럼 보인다.**
#   바인딩에 `remote` 를 켜고 **플래그 없이** `wrangler dev` 를 쓰는 것이 정상 경로다.
# ⚠️ `experimental_remote` 는 이 버전(4.115)에 **없는 필드**라 경고만 찍고 local 로 조용히
#    떨어진다 — 오타 하나가 "운영을 본다고 믿으며 빈 로컬을 보는" 상태를 만든다.
remote = true
# 프리뷰 경로로 새지 않도록 database_id 와 **같은 값**으로 못 박는다.
preview_database_id = "59a8409e-3be6-467b-8214-7938c59c8729"

# 환경을 아는 값은 여기 둔다 — 요청 로그의 `env` 컬럼이 이 값을 그대로 싣는다.
# 키 이름이 아니라 **값**이 환경을 정한다(ASK-Seoul#78 `Z-7`). 지표가 조용히 섞이는 것을
# 막는 게 목적이다 — 실측으로 운영 D1 에 `dev` 17건, 개발 D1 에 `prod` 63건이 이미 있다.
#
# ⚠️ **base env 는 로컬 전용이다 — 배포하지 않는다.** 여기서 배포하면 배포면의 기록이
#    `local` 로 남아 실제 환경을 못 덮는다. 배포는 `--env production` 만 쓴다.
[vars]
ASK_ENV = "local"
# Google OAuth (#110 ②) — 이메일 소유 확인을 Google 에 위임한다.
# 🔴 **값이 있으면 정책이 바뀐다**: `POST /api/v1/keys`(이메일 발급)가 403 으로 닫히고
#    `/api/v1/auth/google` 만 남는다. 로컬은 비워 두는 게 기본이다 — 그래야 발급 폼으로
#    검증할 수 있고, OAuth 리다이렉트가 로컬 주소로 등록돼 있지 않아도 된다.
# client_id 는 공개값이라 여기 둔다. **client_secret 은 `wrangler secret put` 으로만.**
GOOGLE_CLIENT_ID = ""

# ── dev 배포면 폐지 (2026-08-06, 팀 합의) ────────────────────────────────────
# `[env.dev]`(dev.ask-seoul.kr)은 지웠다. D1 이 운영 하나뿐이 된 뒤(decision/0015)
# dev 배포면은 **같은 운영 데이터를 다른 주소로 한 번 더 보여주는 것**뿐이었고,
# 그 값에 비해 주소·워커·시크릿·배포 경로를 두 벌 유지하는 비용이 컸다.
# 남는 환경은 로컬(위 base)과 운영(아래) 둘이며, 브랜치도 그에 맞췄다 —
# `dev` 는 통합, `main` 이 배포다(.github/workflows/deploy-prod.yml).

# ── 배포 전용 환경 (2026-08-03, ASAC-DAG#668) — https://ask-seoul.kr ─────────
# 파이프라인이 prod D1(ask-seoul-prod-d1)에 68개 제품을 게시한다. 두 환경(로컬·prod)이
# **같은 D1** 을 보고, 갈리는 것은 `ASK_ENV` 값과 배포 주소뿐이다(#85).
# ⚠️ 선행: prod D1 스키마를 새로 만들 때는 파이프라인 쪽과 조율(agreement §8-3),
# ISSUANCE_SALT 를 `--env production` 으로 설정(2026-08-06 완료).
# 🔴 `custom_domain = true` 가 아니라 **Route** 다 — 이유가 있다.
# 루트에는 도메인 등록업체 파킹 페이지의 A 레코드 2개(75.2.85.42 · 99.83.196.71)가 남아
# 있고, 커스텀 도메인은 그 자리에 자기 레코드를 만들려다 409 로 거부된다
# (`code 100117: already has externally managed DNS records`).
# Route 는 **기존 프록시 레코드 앞에서 요청을 가로채므로** DNS 를 건드리지 않고 동작한다.
#
# ⚠️ 대가: 저 파킹 레코드가 **Route 의 전제**가 된다 — 프록시(주황 구름)된 레코드가 없으면
#    Route 도 죽는다. "쓸모없어 보이는 레코드"를 누가 지우면 루트가 통째로 내려간다.
#    파킹 레코드를 지울 수 있게 되면 `{ pattern = "ask-seoul.kr", custom_domain = true }`
#    로 되돌리는 게 정석이다(ops·transit 이 그 방식이다).
[env.production]
name = "ask-seoul-gateway"
workers_dev = false
routes = [
  { pattern = "ask-seoul.kr/*", zone_name = "ask-seoul.kr" }
]

[env.production.assets]
directory = "public"
# 🔴 **env 섹션은 상속되지 않는다**(아래 `[env.production.vars]` 주석과 같은 이유).
#    base 의 `binding` 이 여기까지 오지 않으므로 다시 쓴다 — 빠지면 배포본에서 `env.ASSETS`
#    가 undefined 라 `/llms.txt` 요청이 그대로 던지고, **고치려던 그 파일이 500 이 된다.**
binding = "ASSETS"
# 정적 문서 넷이 여기 있는 이유는 **둘로 갈린다** — 섞어 읽으면 안 된다:
#   charset 교정(#237)    `/llms.txt` · `/robots.txt`
#   page_path 관측(#285)  `/llms.txt` · `/openapi.json` · `/skill-openapi.json`
# 그래서 **워커 통과 4경로 ≠ 관측 3경로**다(`robots.txt` 는 통과만 하고 세지 않는다).
# 워커를 거치므로 이 넷은 엣지 캐시를 잃는다 — 문서 넷이라 감수한다.
run_worker_first = ["/api/v1/*", "/skill/v1/*", "/mcp", "/llms.txt", "/robots.txt", "/openapi.json", "/skill-openapi.json"]
not_found_handling = "404-page"

[[env.production.d1_databases]]
binding = "DB"
database_name = "ask-seoul-prod-d1"
database_id = "59a8409e-3be6-467b-8214-7938c59c8729"

# env 섹션은 **상속되지 않는다** — 위 `[vars]` 가 여기까지 오지 않으므로 다시 쓴다.
# 빠지면 배포본이 `env` 를 NULL 로 기록하고, 그건 "환경을 모른다"가 되어 §6-2 의
# 섞임을 걸러낼 수 없다.
[env.production.vars]
ASK_ENV = "prod"
# 🔴 여기에 실제 client_id 를 넣어야 Google 발급이 켜진다(#110 ②). 비어 있으면 이메일 발급이
#    그대로 열려 있다 — 즉 **이 한 줄이 정책 스위치다.** client_secret 은 시크릿으로 따로.
#    절차: docs/manual-steps.md 의 "Google OAuth 클라이언트" 절.
#    ⚠️ 이 값만으로는 아무것도 안 바뀐다 — GOOGLE_CLIENT_SECRET 시크릿이 함께 있어야 켜진다.
GOOGLE_CLIENT_ID = "229192956601-567ajcmqdlgj83k1btqlfanlf12f5nei.apps.googleusercontent.com"
