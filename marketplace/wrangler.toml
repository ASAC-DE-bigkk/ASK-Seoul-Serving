# marketplace — V1 마켓플레이스 프로토타입 (ASK-Seoul#58)
# ⚠️ 로컬 전용: wrangler dev --local 로만 구동한다. deploy 는 멘토 게이트(#476 ①·ASAC-DAG#521-(B)).
# 로컬 모드는 아래 database_id 를 쓰지 않고 Miniflare 로컬 sqlite 를 만든다 —
# 시드는 `npm run seed` (migrations + fixtures 를 --local 로 적용).
name = "ask-seoul-gateway"
main = "src/index.js"
compatibility_date = "2026-07-01"

[assets]
directory = "public"
# API 라우트는 Worker 로, 그 외 정적 파일은 Assets 가 서빙.
# 새 API 네임스페이스를 만들면 **여기 먼저 등록**해야 한다 — 빠지면 요청이 워커에 닿지도
# 못하고 정적 404 페이지로 떨어진다(경로가 없는 것처럼 보여 원인 찾기가 오래 걸린다).
# /skill/v1/* 은 그 담당이 착수할 때 추가한다(ASAC-DAG#642 경로 분리).
run_worker_first = ["/api/*", "/v1/*", "/skill/v1/*", "/mcp"]
# 없는 경로는 사람용 404 화면으로 — 이 설정이 없으면 정적 자산에 없는 모든 경로가
# Worker 의 마지막 분기까지 흘러가 application/problem+json 으로 떨어진다.
# 오타 URL 로 들어온 사람이 JSON 덩어리를 보게 되던 원인이었다(/api/* 는 그대로 JSON 이 맞다).
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "ask-seoul-dev-d1"
database_id = "9db0e851-558e-489f-9e76-f131d25aa267"

# ── 배포 전용 환경 (2026-08-03, ASAC-DAG#668) ────────────────────────────────
# 파이프라인이 prod D1(ask-seoul-prod-d1)을 신설해 62개 제품 게시를 시작했다.
# 기본(위) 바인딩은 dev D1 을 유지한다 — 로컬 Miniflare 상태가 database_id 로
# 키잉되어 콘솔(../ops-dashboard)과 같은 로컬 DB 를 공유하기 때문(decision/0003).
# 여길 바꾸면 로컬 협업 상태가 갈라진다. 배포는 `wrangler deploy --env production`
# 만 쓴다 — 여전히 멘토 게이트(#476 ①) 이후의 일이다(docs/deploy-runbook.md).
[env.production]
name = "ask-seoul-gateway"

[env.production.assets]
directory = "public"
run_worker_first = ["/api/*", "/v1/*", "/skill/v1/*", "/mcp"]
not_found_handling = "404-page"

[[env.production.d1_databases]]
binding = "DB"
database_name = "ask-seoul-prod-d1"
database_id = "59a8409e-3be6-467b-8214-7938c59c8729"
